<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>モンスト反射ガイド</title>
    <style>
        /* ★モンスト風の力強い太字・立体感を出すための共通設定 */
        body {
            background-color: #121214;
            color: #fff;
            font-family: 'Arial Black', 'Helvetica Neue', Arial, sans-serif;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            touch-action: manipulation;
            -webkit-font-smoothing: antialiased;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 900;
            color: #fff;
            margin: 5px 0 10px 0;
            /* モンスト風の黄色い強力な文字フチ（シャドウ） */
            text-shadow: 
                -2px -2px 0 #000,  2px -2px 0 #000,
                -2px  2px 0 #000,  2px  2px 0 #000,
                 0px  3px 6px rgba(0, 0, 0, 0.8),
                 0 0 12px #ffcc00;
            letter-spacing: 1px;
        }

        .menu-panel {
            list-style: none;
            padding: 8px 12px;
            margin: 0 0 10px 0;
            background: rgba(25, 25, 35, 0.85);
            border: 2px solid rgba(255, 204, 0, 0.4);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            font-size: 0.85rem;
        }

        input[type="file"] {
            color: #a1a1aa;
            font-size: 0.8rem;
        }
        input[type="file"]::file-selector-button {
            background: linear-gradient(135deg, #ffcc00, #ff6600);
            color: #000;
            border: 1px solid #fff;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: 900;
            cursor: pointer;
            text-shadow: none;
        }

        button {
            background: linear-gradient(180deg, #444455, #222233);
            color: #fff;
            border: 1.5px solid rgba(255, 255, 255, 0.4);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            /* モンストのボタンっぽい黒フチ */
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
        }
        button:active {
            background: linear-gradient(180deg, #ffcc00, #ff8800);
            color: #000;
            text-shadow: none;
        }

        /* スマホ用操作パッドのスタイル */
        .touch-control-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
            background: rgba(25, 25, 35, 0.85);
            padding: 10px 15px;
            border-radius: 12px;
            border: 2px solid rgba(255, 204, 0, 0.4);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .control-row {
            display: flex;
            gap: 10px;
        }

        .control-btn {
            background: linear-gradient(180deg, #333344, #1a1a24);
            color: #00ffcc;
            border: 1.5px solid rgba(0, 255, 204, 0.5);
            padding: 10px 18px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
        }
        .control-btn:active {
            background: #00ffcc;
            color: #000;
            text-shadow: none;
        }

        canvas {
            border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 165, 0, 0.8);
            cursor: crosshair;
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <h2>モンスト反射ガイド</h2>

    <!-- メニューバー -->
    <ul class="menu-panel">
        <li><input type="file" id="imageLoader" accept="image/*"></li>
        <li>
            <button id="btnReflect" onclick="setType('reflect')" style="font-weight:bold; background:linear-gradient(180deg, #00aa55, #004422);">反射</button>
            <button id="btnPierce" onclick="setType('pierce')">貫通</button>
        </li>
        <li>
            回数: 
            <button onclick="setBounce(3)">3</button>
            <button onclick="setBounce(6)" style="font-weight:bold;">6</button>
            <button onclick="setBounce(10)">10</button>
        </li>
    </ul>

    <!-- シミュレーション用キャンバス -->
    <canvas id="guideCanvas"></canvas>

    <!-- スマホ用タッチ操作パッド -->
    <div class="touch-control-panel">
        <div style="font-size: 0.75rem; color: #ffcc00; font-weight: 900; text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; margin-bottom: -2px;">方向・引っ張り調整</div>
        <div class="control-row">
            <button class="control-btn" ontouchstart="adjustAim('left')" onclick="adjustAim('left')">◀ 左回転</button>
            <button class="control-btn" ontouchstart="adjustAim('right')" onclick="adjustAim('right')">右回転 ▶</button>
        </div>
        <div class="control-row">
            <button class="control-btn" ontouchstart="adjustAim('up')" onclick="adjustAim('up')">▲ 伸ばす</button>
            <button class="control-btn" ontouchstart="adjustAim('down')" onclick="adjustAim('down')">▼ 縮める</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
